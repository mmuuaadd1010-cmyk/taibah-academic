name: Fix mobile schedule tab

on:
  push:
    paths:
      - '.github/workflows/fix-schedule-mobile-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add جدولي الآن to mobile navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "entries=[['home','الرئيسية'],['plan','الخطة'],['subscription','اشتراكي'],['tutors','مدرسون خصوصيون'],['menu','المزيد']]"
          new = "entries=[['home','الرئيسية'],['plan','الخطة'],['schedule','جدولي الآن'],['subscription','اشتراكي'],['tutors','مدرسون خصوصيون'],['menu','المزيد']]"
          if old in s:
              s = s.replace(old, new, 1)

          old_css = 'grid-template-columns:1fr 1fr 1fr 1.25fr 1fr!important'
          new_css = 'grid-template-columns:repeat(6,1fr)!important'
          if old_css in s:
              s = s.replace(old_css, new_css, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix جدولي الآن mobile tab'
          git push
