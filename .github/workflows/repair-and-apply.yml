name: repair-and-apply-site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'repair site and apply requested UI changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original index and apply changes
        run: |
          set -e
          git checkout 2714566e37c52b9de66a7ad50f6985ff9a2ff9b4 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<style id="tu-v14-plan-choice-css">')
          end=s.index('</script>', s.index('<script id="tu-v14-plan-choice-js">'))+len('</script>')
          replacement='''<script id="tu-v14-plan-choice-js">\n(function(){\n  /* اختيار التخصص أصبح مفتوحًا للجميع — لا توجد شاشة اختيار مدفوع/مجاني. */\n  window.tuV14CustomFree=function(){return false};\n  window.tuV14ReadyPaid=function(){return false};\n  window.tuV14ApplyPlanChoice=function(){};\n  window.tuV14ResetMode=function(){try{localStorage.removeItem('tu_plan_mode_v14');if(typeof student!==\'undefined\'&&student)student._tuPlanModeV15=\'\';}catch(e){}};\n})();\n</script>'''
          s=s[:start]+replacement+s[end:]
          css='''<style id="tu-login-telegram-promo-css">\n#tu-login-telegram-promo{position:fixed;inset:0;z-index:500000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,5,10,.72);backdrop-filter:blur(12px);direction:rtl}\n#tu-login-telegram-promo.on{display:flex}\n.tu-tg-promo-card{width:min(430px,100%);border:1px solid rgba(82,142,255,.28);border-radius:24px;background:linear-gradient(155deg,#111a2a,#080d15 72%);box-shadow:0 30px 90px rgba(0,0,0,.65);padding:24px;text-align:center;color:#eef4ff}\n.tu-tg-promo-icon{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:#229ed9;display:grid;place-items:center;box-shadow:0 12px 30px rgba(34,158,217,.25)}\n.tu-tg-promo-icon svg{width:38px;height:38px;fill:#fff}\n.tu-tg-promo-card h3{margin:0 0 8px;font-size:21px;font-weight:950}\n.tu-tg-promo-card .tu-tg-ok{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;color:#82a9ff;font-size:11px;font-weight:900}\n.tu-tg-promo-card p{margin:0 auto 17px;max-width:340px;color:#a8b4c7;font-size:12px;line-height:1.9}\n.tu-tg-promo-link{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border-radius:13px;background:linear-gradient(135deg,#229ed9,#168ac2);color:#fff;text-decoration:none;font-size:12px;font-weight:950;box-shadow:0 10px 24px rgba(34,158,217,.18)}\n.tu-tg-promo-close{width:100%;margin-top:9px;min-height:42px;border:1px solid #26354b;border-radius:12px;background:#0e1520;color:#aeb9ca;font-family:inherit;font-size:11px;font-weight:900;cursor:pointer}\n</style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          fn='''function showTelegramLoginPromo(){\n  try{\n    if(!CURRENT_USER||!CURRENT_USER.id)return;\n    var key='tu_tg_welcome_'+CURRENT_USER.id;\n    if(sessionStorage.getItem(key))return;\n    sessionStorage.setItem(key,'1');\n    var old=document.getElementById('tu-login-telegram-promo');\n    if(old)old.remove();\n    var ov=document.createElement('div');\n    ov.id='tu-login-telegram-promo';\n    ov.innerHTML='<div class="tu-tg-promo-card" role="dialog" aria-modal="true" aria-label="قناة المنصة">'+\n      '<div class="tu-tg-promo-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21.5 3.3 18.3 20c-.24 1.18-.86 1.47-1.75.92l-4.82-3.55-2.33 2.24c-.26.26-.48.48-.98.48l.35-4.9 8.92-8.06c.39-.35-.09-.55-.61-.2L6.06 13.7 1.33 12.22c-1.03-.32-1.05-1.03.22-1.5L20.04 3.3c.87-.32 1.63.2 1.46 0Z"/></svg></div>'+\n      '<div class="tu-tg-ok">✓ تم تسجيل الدخول بنجاح</div>'+\n      '<h3>تابع قناة المنصة على تيليجرام</h3>'+\n      '<p>في قناة المنصة ننشر أهم التحديثات، التنبيهات الجديدة، وخصومات الاشتراك والعروض أولًا بأول.</p>'+\n      '<a class="tu-tg-promo-link" href="https://t.me/taibahiacademic" target="_blank" rel="noopener noreferrer">انضم إلى قناة المنصة</a>'+\n      '<button type="button" class="tu-tg-promo-close" onclick="document.getElementById(\\'tu-login-telegram-promo\\').classList.remove(\\'on\\')">متابعة إلى المنصة</button>'+\n      '</div>';\n    ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('on')});\n    document.body.appendChild(ov);\n    setTimeout(function(){ov.classList.add('on')},650);\n  }catch(e){}\n}\n'''
          s=s.replace('async function afterLogin(){',fn+'async function afterLogin(){',1)
          s=s.replace('  routeLocal();\n}\nfunction injectAccountUI(){','  routeLocal();\n  setTimeout(showTelegramLoginPromo, 250);\n}\nfunction injectAccountUI(){',1)
          old2="async function authLogout(){ try{ await cloudPush(); }catch(e){} try{ if(sbClient) await sbClient.auth.signOut(); }catch(e){} clearLocalUserData(); CURRENT_USER=null; location.reload(); }"
          new2="async function authLogout(){ var _uid=CURRENT_USER&&CURRENT_USER.id; try{ await cloudPush(); }catch(e){} try{ if(_uid)sessionStorage.removeItem('tu_tg_welcome_'+_uid); }catch(e){} try{ if(sbClient) await sbClient.auth.signOut(); }catch(e){} clearLocalUserData(); CURRENT_USER=null; location.reload(); }"
          if old2 not in s: raise SystemExit('authLogout pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git config user.name 'mmuuaadd1010-cmyk'
          git config user.email 'mmuuaadd1010@gmail.com'
          git add index.html
          git commit -m 'repair site and apply requested UI changes'
          git push origin main
