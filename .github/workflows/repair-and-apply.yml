name: repair-and-apply-site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'apply requested promotion flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original index and apply requested UI
        run: |
          set -e
          git checkout 2714566e37c52b9de66a7ad50f6985ff9a2ff9b4 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<style id="tu-v14-plan-choice-css">')
          end=s.index('</script>', s.index('<script id="tu-v14-plan-choice-js">'))+len('</script>')
          replacement='''<script id="tu-v14-plan-choice-js">\n(function(){\n  window.tuV14CustomFree=function(){return false};\n  window.tuV14ReadyPaid=function(){return false};\n  window.tuV14ApplyPlanChoice=function(){};\n  window.tuV14ResetMode=function(){try{localStorage.removeItem('tu_plan_mode_v14');if(typeof student!==\'undefined\'&&student)student._tuPlanModeV15=\'\';}catch(e){}};\n})();\n</script>'''
          s=s[:start]+replacement+s[end:]
          css='''<style id="tu-login-telegram-promo-css">\n#tu-login-telegram-promo{position:fixed;inset:0;z-index:500000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,5,10,.72);backdrop-filter:blur(12px);direction:rtl}\n#tu-login-telegram-promo.on{display:flex}\n.tu-tg-promo-card{width:min(430px,100%);border:1px solid rgba(82,142,255,.28);border-radius:24px;background:linear-gradient(155deg,#111a2a,#080d15 72%);box-shadow:0 30px 90px rgba(0,0,0,.65);padding:24px;text-align:center;color:#eef4ff}\n.tu-tg-promo-icon{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:#229ed9;display:grid;place-items:center;box-shadow:0 12px 30px rgba(34,158,217,.25)}\n.tu-tg-promo-icon svg{width:38px;height:38px;fill:#fff}\n.tu-tg-promo-card h3{margin:0 0 8px;font-size:21px;font-weight:950}\n.tu-tg-promo-card .tu-tg-ok{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;color:#82a9ff;font-size:11px;font-weight:900}\n.tu-tg-promo-card p{margin:0 auto 17px;max-width:340px;color:#a8b4c7;font-size:12px;line-height:1.9}\n.tu-tg-promo-link{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border-radius:13px;background:linear-gradient(135deg,#229ed9,#168ac2);color:#fff;text-decoration:none;font-size:12px;font-weight:950;box-shadow:0 10px 24px rgba(34,158,217,.18)}\n.tu-tg-promo-close{width:100%;margin-top:9px;min-height:42px;border:1px solid #26354b;border-radius:12px;background:#0e1520;color:#aeb9ca;font-family:inherit;font-size:11px;font-weight:900;cursor:pointer}\n#tu-offer-promo{position:fixed;inset:0;z-index:500001;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,5,10,.78);backdrop-filter:blur(13px);direction:rtl}\n#tu-offer-promo.on{display:flex}\n.tu-offer-card{width:min(470px,100%);border:1px solid rgba(54,116,255,.34);border-radius:26px;background:linear-gradient(155deg,#101a2c,#070b12 75%);box-shadow:0 35px 100px rgba(0,0,0,.72);padding:25px;text-align:center;color:#f5f8ff;position:relative;overflow:hidden}\n.tu-offer-card:before{content:"";position:absolute;inset:-60% -20%;background:radial-gradient(circle,rgba(43,107,255,.18),transparent 55%);pointer-events:none}\n.tu-offer-badge{position:relative;display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(255,183,0,.12);border:1px solid rgba(255,183,0,.28);color:#ffd66b;font-size:11px;font-weight:950}\n.tu-offer-card h2{position:relative;margin:14px 0 7px;font-size:24px;font-weight:950}\n.tu-offer-card .tu-offer-price{position:relative;font-size:40px;font-weight:1000;line-height:1.1;margin:8px 0}.tu-offer-price small{font-size:13px;color:#aeb9ca;font-weight:800}\n.tu-offer-card .tu-offer-month{position:relative;color:#82a9ff;font-size:13px;font-weight:900;margin-bottom:13px}\n.tu-offer-card p{position:relative;margin:0 auto 15px;max-width:390px;color:#aab5c6;font-size:12px;line-height:1.9}\n.tu-offer-benefits{position:relative;display:grid;gap:7px;text-align:right;margin:0 0 15px}.tu-offer-benefits div{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);font-size:11px;color:#d8e0ec}.tu-offer-benefits b{color:#fff}\n.tu-pay-title{position:relative;margin:10px 0 8px;color:#8e9bb0;font-size:10px;font-weight:900}.tu-payments{position:relative;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}.tu-payment{padding:7px 11px;border-radius:10px;background:#0b111b;border:1px solid #243247;color:#dbe5f5;font-size:10px;font-weight:900}\n.tu-offer-buy{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:14px;background:linear-gradient(135deg,#2d6df6,#1c55d7);color:#fff;text-decoration:none;font-size:13px;font-weight:1000;box-shadow:0 12px 28px rgba(45,109,246,.28);cursor:pointer;border:0;font-family:inherit}.tu-offer-buy:hover{filter:brightness(1.06)}\n.tu-offer-later{position:relative;width:100%;margin-top:8px;min-height:40px;border:1px solid #26354b;border-radius:12px;background:#0c121c;color:#aeb9ca;font-family:inherit;font-size:10px;font-weight:900;cursor:pointer}\n.tu-offer-note{position:relative;margin-top:10px;color:#7f8da2;font-size:9px}\n</style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          fn='''function showTelegramLoginPromo(){\n  try{\n    if(!CURRENT_USER||!CURRENT_USER.id)return;\n    var key='tu_tg_welcome_'+CURRENT_USER.id;\n    if(sessionStorage.getItem(key))return;\n    sessionStorage.setItem(key,'1');\n    var old=document.getElementById('tu-login-telegram-promo'); if(old)old.remove();\n    var ov=document.createElement('div'); ov.id='tu-login-telegram-promo';\n    ov.innerHTML='<div class="tu-tg-promo-card" role="dialog" aria-modal="true" aria-label="قناة المنصة">'+\n      '<div class="tu-tg-promo-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21.5 3.3 18.3 20c-.24 1.18-.86 1.47-1.75.92l-4.82-3.55-2.33 2.24c-.26.26-.48.48-.98.48l.35-4.9 8.92-8.06c.39-.35-.09-.55-.61-.2L6.06 13.7 1.33 12.22c-1.03-.32-1.05-1.03.22-1.5L20.04 3.3c.87-.32 1.63.2 1.46 0Z"/></svg></div>'+\n      '<div class="tu-tg-ok">✓ تم تسجيل الدخول بنجاح</div>'+\n      '<h3>تابع قناة المنصة على تيليجرام</h3>'+\n      '<p>في قناة المنصة ننشر أهم التحديثات، التنبيهات الجديدة، وخصومات الاشتراك والعروض أولًا بأول.</p>'+\n      '<a class="tu-tg-promo-link" href="https://t.me/taibahiacademic" target="_blank" rel="noopener noreferrer">انضم إلى قناة المنصة</a>'+\n      '<button type="button" class="tu-tg-promo-close" onclick="document.getElementById(\\'tu-login-telegram-promo\\').classList.remove(\\'on\\');setTimeout(showLimitedOfferPromo,450)">متابعة إلى المنصة</button>'+\n      '</div>';\n    ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('on');setTimeout(showLimitedOfferPromo,450)}});\n    document.body.appendChild(ov); setTimeout(function(){ov.classList.add('on')},650);\n  }catch(e){}\n}\nfunction showLimitedOfferPromo(){\n  try{\n    if(!CURRENT_USER||!CURRENT_USER.id)return;\n    var key='tu_offer_30_'+CURRENT_USER.id; if(sessionStorage.getItem(key))return;\n    sessionStorage.setItem(key,'1');\n    var old=document.getElementById('tu-offer-promo'); if(old)old.remove();\n    var ov=document.createElement('div'); ov.id='tu-offer-promo';\n    ov.innerHTML='<div class="tu-offer-card" role="dialog" aria-modal="true" aria-label="عرض الاشتراك السنوي">'+\n      '<div class="tu-offer-badge">🔥 عرض لفترة محدودة جدًا</div>'+\n      '<h2>اشتراك السنة بـ 30 ريال فقط</h2>'+\n      '<div class="tu-offer-price">30 <small>ريال / سنة</small></div>'+\n      '<div class="tu-offer-month">يعني عليك الشهر بـ 2.5 ريال فقط</div>'+\n      '<p>إذا كنت ناوي تكمل مع المنصة، هذا أفضل وقت للاشتراك. السعر مخفّض لفترة محدودة جدًا، وبعد انتهاء العرض قد يعود السعر المعتاد.</p>'+\n      '<div class="tu-offer-benefits"><div>✓ <b>سنة كاملة</b> من الاشتراك بسعر العرض</div><div>✓ وصول سريع بعد إتمام الدفع وتفعيل الاشتراك</div><div>✓ <b>لا تفوّت العرض</b> — الكمية/المدة محدودة</div></div>'+\n      '<div class="tu-pay-title">طرق الدفع المتاحة في صفحة الدفع</div>'+\n      '<div class="tu-payments"><span class="tu-payment">مدى</span><span class="tu-payment">Apple Pay</span><span class="tu-payment">البطاقات البنكية</span><span class="tu-payment">تمارا</span></div>'+\n      '<a class="tu-offer-buy" href="https://salla.sa/silvrcol/اشتراك-طيبه-اكاديمي-سنه/p1931426482" target="_blank" rel="noopener noreferrer">أبي العرض بـ 30 ريال</a>'+\n      '<button type="button" class="tu-offer-later" onclick="document.getElementById(\\'tu-offer-promo\\').classList.remove(\\'on\\')">متابعة بدون الاشتراك الآن</button>'+\n      '<div class="tu-offer-note">يظهر العرض مرة واحدة لكل تسجيل دخول.</div>'+\n      '</div>';\n    document.body.appendChild(ov); setTimeout(function(){ov.classList.add('on')},200);\n  }catch(e){}\n}\nfunction goToSubscriptionPurchase(){\n  window.open('https://salla.sa/silvrcol/اشتراك-طيبه-اكاديمي-سنه/p1931426482','_blank','noopener');\n}\n'''
          s=s.replace('async function afterLogin(){',fn+'async function afterLogin(){',1)
          s=s.replace('  routeLocal();\n}\nfunction injectAccountUI(){','  routeLocal();\n  setTimeout(showTelegramLoginPromo, 250);\n}\nfunction injectAccountUI(){',1)
          old2="async function authLogout(){ try{ await cloudPush(); }catch(e){} try{ if(sbClient) await sbClient.auth.signOut(); }catch(e){} clearLocalUserData(); CURRENT_USER=null; location.reload(); }"
          new2="async function authLogout(){ var _uid=CURRENT_USER&&CURRENT_USER.id; try{ await cloudPush(); }catch(e){} try{ if(_uid){sessionStorage.removeItem('tu_tg_welcome_'+_uid);sessionStorage.removeItem('tu_offer_30_'+_uid);} }catch(e){} try{ if(sbClient) await sbClient.auth.signOut(); }catch(e){} clearLocalUserData(); CURRENT_USER=null; location.reload(); }"
          if old2 in s: s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git config user.name 'mmuuaadd1010-cmyk'
          git config user.email 'mmuuaadd1010@gmail.com'
          git add index.html
          git commit -m 'apply requested promotion flow'
          git push origin main
